
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #spinner {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 32px;
      height: 32px;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img
    id="spinner"
    src="https://YOUR_USERNAME.github.io/YOUR_REPO/spinner.png"
    alt=""
  >
