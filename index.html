
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSA5 - Loading Screen Test</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

#background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

#shade {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(0,0,0,.5)
    );
}

#title {
    position: fixed;
    left: 4%;
    bottom: 6%;
    text-shadow: 0 2px 12px black;
}

#title h1 {
    margin: 0;
    font-size: clamp(25px, 4vw, 54px);
    font-weight: 900;
    letter-spacing: 2px;
}

#title p {
    letter-spacing: 4px;
    font-size: 11px;
}

#spinnerBox {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
}

#spinner {
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: spin 1s linear infinite;
}

#fallback {
    width: 36px;
    height: 36px;
    border: 3px solid #ffffff40;
    border-top-color: white;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#status {
    position: fixed;
    right: 27px;
    bottom: 82px;
    font-size: 10px;
    letter-spacing: 2px;
    text-shadow: 0 1px 5px black;
}

#error {
    position: fixed;
    top: 40px;
    left: 20px;
    color: #ffb0b0;
    font-size: 12px;
    max-width: 80%;
}
</style>
</head>

<body>

<img id="background" alt="GSA5 background">

<div id="shade"></div>

<div id="title">
    <h1>GRAND STEAL AUTO</h1>
    <p>LOS SANTOS · LOADING</p>
</div>

<div id="status">LOADING...</div>
<div id="error"></div>

<div id="spinnerBox">
    <div id="fallback"></div>
    <img id="spinner" alt="Loading spinner" hidden>
</div>

<script>
const base =
    "https://raw.githubusercontent.com/magentadotdev/GSA5/main/";

const background = document.getElementById("background");
const spinner = document.getElementById("spinner");
const fallback = document.getElementById("fallback");
const status = document.getElementById("status");
const error = document.getElementById("error");

// Update these filenames to match your repository.
const backgrounds = [
    "ls0_background.webp",
    "ls1_background.webp",
    "ls2_background.webp",
    "ls3_background.webp",
    "ls4_background.webp",
    "ls5_background.webp",
    "ls6_background.webp",
    "ls7_background.webp",
    "ls8_background.webp",
    "ls9_background.webp",
    "ls10_background.webp",
    "ls11_background.webp",
    "ls12_background.webp",
    "ls13_background.webp",
    "ls14_background.webp",
    "ls15_background.webp",
    "ls16_background.webp"
];

let index = 0;
let timer;

function loadImage(url) {
    return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => resolve(url);
        image.onerror = reject;
        image.src = url;
    });
}

async function showBackground() {
    clearTimeout(timer);

    // Fade the current background out.
    background.style.opacity = "0";
    status.textContent = "LOADING...";

    const filename = backgrounds[index];
    const url = base + filename;

    try {
        await loadImage(url);

        background.src = url;
        error.textContent = "";

        // Fade the new background in.
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                background.style.opacity = "1";
                status.textContent = "LOADING";

                // Hold the image before fading it out again.
                timer = setTimeout(() => {
                    background.style.opacity = "0";

                    timer = setTimeout(() => {
                        index = (index + 1) % backgrounds.length;
                        showBackground();
                    }, 1600);
                }, 4200);
            });
        });
    } catch {
        error.textContent =
            "Could not load: " + filename +
            ". Check the filename and GitHub branch.";

        timer = setTimeout(() => {
            index = (index + 1) % backgrounds.length;
            showBackground();
        }, 2000);
    }
}

// Try the custom spinner. If its filename differs,
// the CSS spinner remains visible.
const spinnerNames = [
    "spinner.webp",
    "spinner.png",
    "spinner.gif",
    "spinner.svg",
    "loading.webp",
    "loading.png",
    "loading.gif"
];

function trySpinner(i = 0) {
    if (i >= spinnerNames.length) return;

    const image = new Image();

    image.onload = () => {
        spinner.src = image.src;
        spinner.hidden = false;
        fallback.hidden = true;
    };

    image.onerror = () => trySpinner(i + 1);
    image.src = base + spinnerNames[i];
}

trySpinner();
showBackground();
</script>

</body>
</html>
